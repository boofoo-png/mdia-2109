<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Class Stuff</title>
        <style>
            h1 {
                color: blue;
            }
        </style>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        Welcome to my webpage!

        <header>
        <h1 class="heading-1" id="heading-one">Welcome to my practice page!</h1>
        <h2>This is a second-level heading</h2>
        <h3>This is a third-level heading</h3>
</header>
        <img src="fat pikachu.jpg" alt="Fat Pikachu" width="300" />

        <blockquote>This is a quote! -Sidney Crosby</blockquote>
        <p>This is a paragraph tag!</p>
        <b>This is a bold tag!</b>
        <i>This is an italic tag!</i>
        <strong>This is a strong tag!</strong>
        <em>This is a tag for emphasis!</em>

        <input type="checkbox" />
        <input type="radio" />
        <input type="number" />
        <input type="text" />
        <input type="password" />
        <input type="email" />
    </body>
</html>
